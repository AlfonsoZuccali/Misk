; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.30

build_flags =
    -D USER_SETUP_LOADED=1
    
    ; --- Driver ST7735 ---
    -D ST7735_DRIVER=1
    -D ST7735_BLACKTAB=1    ; Pruebe este primero. Si falla, cambie a GREENTAB o REDTAB
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    
    ; --- Pines SPI (VSPI ESP32) ---
    -D TFT_MISO=-1
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5             ; Conecte CS al GPIO 5
    -D TFT_DC=2
    -D TFT_RST=4
    
    ; --- Backlight ---
    -D TFT_BL=21            ; Pin de luz de fondo
    -D TFT_BACKLIGHT_ON=255
    
    ; --- Configuración General ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=20000000 ; 27MHz es seguro para ST7735